schema_version: "1.0"
units:
  length: in
  speed: in/min

planner:
  name: "Default FRC Planner"
  description: "Default planning preferences for FRC student jobs"

defaults:
  max_tools: 1
  coordinate_system: G55
  stock:
    material: plywood
    thickness: 0.25          # 1/4"
    z_zero: stock_top
  origin_location: bottom_left
  workholding: [screws]
  part_holding: [tabs]
  default_tool: t5           # 1/4" 2-flute upcut
  milling_direction: conventional   # climb | conventional
  finishing_allowance: 0.01
  cut_deeper_than_stock: 0.01
  min_screw_distance: 1.1
  arc_detection:
    mode: FOR_PLANNING
    tolerance: 0.002
  fixups:
    replace_invalid_default_tool:
      enabled: true
      description: "If the requested default tool cannot fit required features, choose the largest fitting tool and warn."
    normalize_contour_finishing:
      enabled: true
      description: "Merge or repair separate/missing contour finishing settings into the contour operation."
    accept_reduced_tab_count:
      enabled: true
      description: "If target tab count cannot be placed on straight segments, use the tabs that can be placed and warn."
    skip_roughing_when_finish_fits:
      enabled: true
      description: "If roughing allowance makes a near-size hole impossible, skip roughing when the selected tool can still finish the feature."
    fall_back_to_local_planner:
      enabled: false
      description: "If AI planning fails, use deterministic local planner and warn the user."
    downgrade_pocket_to_profile_when_tool_fits_boundary:
      enabled: false
      description: "If a pocket cannot be cleared but its boundary can be profiled, convert to an inside contour and warn."
  simulation:
    enabled: true
    xy_tool_fraction: 0.25
    z_spacing: 0.02
    max_grid_cells: 20000000
    preview: true
  tab_settings:
    enabled: true
    width: 0.2
    height: 0.06
    spacing: 3.15

operation_advice:
  workholding:
    - "Use screws when the stock frame has enough margin for corner fastening."
    - "Avoid placing clamps where contour operations could collide with them."
    - "place tabs only on linear edges, and warn me if too sufficient tabs could not be located"
    - "when locating tabs, consider the aspect ratio. for aspect ratio < 2, prefer to place at least tab on each quadrant/side.  for aspects > 2,  place tabs near the ends."
    - "prefer to place tabs across from each other when possible, subject to other placement constraints"
  tools:
    - "Prefer one tool for the whole job when possible."
    - "Choose the largest tool that can still fit every required feature."
  geometry:
    - "A strict four-sided rectangle containing parts is a stock frame, not a part."
    - "Mark top level, four-sided rectangles NOT containing parts as ignored entities"
    - "If no stock frame exists, ask the user for stock size before planning."
    - "For holes between 0.04 inches and 0.2 inches in diameter, prefer a drill operation."
    - "For holes between 0.2 inches and 0.6 inches in diameter, prefer a helical_drill operation."
  strategies:
    - "all inside holes should be full depth unless specified otherwise."
    - "for pockets, use 40% stepover"
    - "when finishing_allowance is greater than zero, outside part contours should use one contour operation with roughing.side_allowance set to that value and finishing.enabled true"
    - "do not create separate finish contour operations; configure finishing inside the contour operation"
