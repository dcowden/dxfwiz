schema_version: "1.0"
units:
  length: in
  speed: in/min

machine:
  name: "Fixup Test Router"
  type: router
  axes: 3
  max_tools: 1
  clear_z: 0.25
  screw_grid: 0.75
  screw_grid_offset: {x: 0, y: 0}
  screw_clearance: 0.3
  maximum_plug_size: 0.25
  operation_sort: [tool, group, nest_order]
  workholding: [tape, screws]
  part_holding: []
  work_envelope:
    x: { min: 0, max: 24 }
    y: { min: 0, max: 24 }
    z: { min: -3, max: 0 }
  coordinate_system:
    x_positive: right
    y_positive: up
    origin: bottom_left
  spindle:
    type: er11
    max_rpm: 24000
    min_rpm: 5000

tools:
  - id: t3
    description: "3/16 flat endmill"
    end_type: flat
    flute_spiral: compression
    diameter: 0.1875
    flutes: 2
    speed: 18000
    feed_rate: 70
    plunge_rate: 20
    depth_per_pass: 0.09375
    step_over: 0.09375
  - id: t5
    description: "1/4 flat endmill"
    end_type: flat
    flute_spiral: upcut
    diameter: 0.25
    flutes: 2
    speed: 18000
    feed_rate: 90
    plunge_rate: 30
    depth_per_pass: 0.125
    step_over: 0.125
