schema_version: "1.0"

operation_advice:
  overall:
    - "Do not invent source DXF entities. If you add screws, tabs, or clamps, list them under generated_entities and reference those ids from operations."
    - "Use operation_groups with these exact names when present: fixtures, internal_pockets, internal_holes, and contours."
    - "For through cuts, depth should be stock thickness plus cut_deeper_than_stock."
    - "Each operation must reference exactly one entity. Multiple holes or multiple contours must be represented as multiple operations."
    - "Do not create separate finishing operations. Finishing is configured inside the same contour, pocket, helical_contour, or helical_pocket operation."
    - "When finishing_allowance is greater than zero, every outside part contour operation should set roughing.side_allowance to that value and finishing.enabled to true."
  workholding:
    - "For screw workholding, place screw holes in scrap areas when a stock frame and part geometry are present."
    - "If using tabs, tabs should be 0.06 inches tall for polycarbonate and 0.1 inches tall for wood or plywood."
    - "Tabs should be placed on linear segments. If enough straight locations are not available, warn the user."
    - "Tab width should be 1x material thickness."
    - "If tabs are used, try to place 4 tabs per part, plus 1 additional tab for every 10x material thickness of perimeter length if 4 is not enough."
    - "If there are insufficient straight locations for tabs, warn the user."
    - "Place tabs opposite each other as much as possible."
    - "If using screws, screw locations should be placed in areas that will remain scrap."
    - "Pre-drill screw locations using the same bit as the job when the job is a one-tool job."
    - "If the job is not a one-tool job, pre-drill screw locations with the smallest available tool."
    - "Screw locations should be placed about every 2 square feet of stock area."
    - "Always put screws in the four corners of the stock when using screw workholding."
    - "Clamp locations must be outside the planned cutting envelope and clear of rapids, leads, ramps, and finishing passes."
    - "When vacuum or tape is used, prefer onion skin or tabs on small parts so released parts cannot move into the cutter."
    - "Small internal cutouts should be machined before large surrounding profiles so the stock remains rigid."
  tools:
    - "For plywood and sheet goods, prefer compression cutters for full-depth outside contours when the compression length is appropriate for the material thickness."
    - "Use downcut tools when top-edge finish is more important than chip evacuation, and avoid deep slots with downcut tools unless chip evacuation is managed."
    - "Use upcut tools when chip evacuation matters, especially for slots, pockets, plastics, and deeper cuts."
    - "Use single-flute or o-flute tools for plastics when available, and keep chips evacuating so the material does not melt."
    - "Avoid using tools whose diameter is larger than the smallest required internal radius or slot."
    - "Prefer the largest tool that satisfies the geometry, stiffness, and finish requirements."
    - "Use the tool's configured feed_rate, plunge_rate, speed, depth_per_pass, and step_over unless the user specifically overrides them."
    - "Do not assume a drill operation can use an end mill unless the tool can plunge and the hole size is appropriate."
  geometry:
    - "Use the geom.yaml entity ids as the source of truth when referencing operations."
    - "Frames and ignored entities are not parts and should not receive machining operations."
    - "Open paths may receive trace operations when the user explicitly asks to follow them."
    - "Closed part boundaries normally receive contour operations with outside offset."
    - "Closed cutouts normally receive inside contour, pocket, drill, helical_contour, or helical_pocket operations depending on size and shape."
    - "Circle cutouts smaller than or close to tool diameter should be drilled only when a suitable tool is available."
    - "Circle cutouts larger than the selected tool should use helical_contour when a single helical contour leaves an acceptably small plug, and helical_pocket when the plug would be too large."
    - "Non-circular internal cutouts should normally be pockets or inside contours."
  strategies:
    - "Always start by inspecting the geometry and finding the largest tool diameter that will do the job."
    - "Only use 1/8 inch tools if necessary to meet geometry or finish criteria."
    - "Always generate transition ramps into cuts."
    - "Set ramping: true on contour operations so outside profiles spiral down around the contour instead of plunging straight into stock."
    - "Always plan the job in this order: holes for screws, interior pockets, interior holes, outer boundaries."
    - "Use feedrates associated with the tools unless specified otherwise."
    - "Use climb cutting for finishing passes and conventional cutting for roughing passes unless material or tool advice says otherwise."
    - "Always use climb cutting on plastics and compression cutters."
    - "For aluminum, use conventional cutting for all passes except finishing passes."
    - "Use ramp or helical entry for pockets and avoid straight plunges when practical."
    - "Machine interior features before exterior contours to keep parts attached and registration stable."
    - "For outside part boundaries with finishing_allowance greater than zero, create one contour operation with roughing.side_allowance set to the requested value."
    - "For outside part boundaries with finishing_allowance greater than zero, set finishing.enabled true on the same contour operation and set finishing.milling_direction to climb. Finishing depth is computed from operation depth plus extra_depth."
    - "Warn if the requested max_tools exceeds machine max_tools and the machine has no tool changer, because manual tool changes will be required."
